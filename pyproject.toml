[project]
name = "amazing-http-logger"
version = "0.1.0"
description = "Backend for collecting and storing HTTP traffic logs generated by user-device agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "starlette>=1.9,<2",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pymongo>=4.13,<5",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx2>=2.16,<3",
  "python-dotenv>=1.0.0",
  "auth0-fastapi-api>=1.0.0b9,<2",
  "joserfc>=1.6.8,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "default:^authlib\\.jose module is deprecated, please use joserfc instead\\.:DeprecationWarning:auth0_api_python\\.api_client",
]

[tool.ruff]
line-length = 100
