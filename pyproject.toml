[project]
name = "amazing-http-logger"
version = "0.1.0"
description = "Backend for collecting and storing HTTP traffic logs generated by user-device agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "motor>=3.2.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
