image:
  tag: dev

auth0:
  domain: example.auth0.com
  audience: https://example.test/api

app:
  port: 9090
  environment: development
  requireHttps: false

service:
  port: 9090

frontend:
  image:
    tag: dev
  port: 3000
  service:
    port: 3000
  # Illustrative only: supply an externally reachable HTTPS origin for live SSR.
  appBaseUrl: https://logger.example.test
  auth0:
    existingSecret: logger-frontend-auth0

mongodb:
  enabled: true

spool:
  # Illustrative resources: provision GCS/Pub/Sub and workload identity before deployment.
  bucket: logger-development-uploads
  eventTopic: projects/logger-development/topics/uploads
  subscription: projects/logger-development/subscriptions/uploads
  silverTopic: projects/logger-development/topics/uploads-silver
  silverSubscription: projects/logger-development/subscriptions/uploads-silver
  parseDlqTopic: projects/logger-development/topics/parse-dlq
  loadDlqTopic: projects/logger-development/topics/load-dlq

openbao:
  enabled: true
