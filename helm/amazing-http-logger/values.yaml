replicaCount: 1

image:
  repository: amazing-http-logger
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

auth0:
  domain: ""
  audience: ""

app:
  port: 9090
  environment: production
  mongoDatabase: amazing_http_logger
  mongoServerSelectionTimeoutMs: 5000
  requireHttps: true
  forwardedAllowIps: "127.0.0.1"

encryption:
  keyAlgorithm: ECDH-ES+A256KW
  contentAlgorithm: A256GCM
  curve: P-384

openbao:
  # Bundled dev mode is ephemeral; use an externally managed service in production.
  enabled: false
  image: ghcr.io/openbao/openbao:2.7.1
  port: 8200
  address: ""
  transitMount: transit
  transitKey: log-keyset
  storageKey: log-storage
  kvMount: secret
  kvPath: log-encryption
  timeoutSeconds: 5
  auth:
    mount: kubernetes
    role: logger-ingestion
    audience: openbao
    existingSecret: ""
    tokenKey: token
  ca:
    existingSecret: ""
    key: ca.crt
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

externalMongo:
  existingSecret: ""
  uriKey: MONGO_URI

externalRedis:
  existingSecret: ""
  urlKey: REDIS_URL

queue:
  stream: traffic-log-batches
  group: mongo-writers
  maxBatches: 10000
  socketTimeoutSeconds: 3
  aofTimeoutMs: 2000

worker:
  replicaCount: 1
  reclaimIdleMs: 60000
  writeTimeoutSeconds: 30
  retrySeconds: 1
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  # Development only: unauthenticated, no TLS. Production uses externalRedis.
  enabled: false
  image: redis:7.4
  port: 6379
  maxmemory: 192mb
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  port: 9090

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: amazing-http-logger-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 3000
  service:
    port: 3000
  # Public browser origin; production must use HTTPS.
  appBaseUrl: ""
  # Defaults to appBaseUrl: SSR API requests traverse the same public ingress.
  # Origin only; do not append /api or /api/v1.
  # Non-loopback HTTP URLs are rejected by the frontend.
  backendApiUrl: ""
  backendApiTimeoutMs: 10000
  auth0:
    # Namespace-local Secret with AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, AUTH0_SECRET.
    existingSecret: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  # Requires an independently installed Ingress controller; no proxy is bundled.
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # Example: [{secretName: logger-tls, hosts: [logger.example.com]}]
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

mongodb:
  # Development only: no authentication or TLS. Use externalMongo for production.
  enabled: false
  port: 27017
  image: mongo:7
  clusterDomain: cluster.local
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
