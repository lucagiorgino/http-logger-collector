apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logger.fullname" . }}-api
  labels:
    {{- include "logger.labels" . | nindent 4 }}
  {{- with .Values.spool.apiServiceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
