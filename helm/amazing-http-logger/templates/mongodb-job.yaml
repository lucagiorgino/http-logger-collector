{{- if .Values.mongodb.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "logger.fullname" . }}-mongo-init-{{ .Release.Revision }}
  labels:
    {{- include "logger.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "logger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: {{ .Values.mongodb.image | quote }}
          command: ["mongosh", "--nodb", "--quiet", "--file", "/scripts/init-replica-set.js"]
          env:
            - name: MONGO_HOSTS
              value: {{ include "logger.mongoHosts" . | quote }}
            - name: HOME
              value: /tmp
            - name: MONGOSH_DISABLE_TELEMETRY
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "logger.fullname" . }}-mongodb-init
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
